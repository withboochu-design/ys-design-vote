<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>진행조회 시안 의견</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--pw:380px;--bg:#E9EDF3;--card:#FFFFFF;--tint:#F5F7FA;--line:#E3E7EE;--hair:rgba(20,30,60,.09);--hair2:rgba(20,30,60,.06);--ink:#141B2D;--sub:#566074;--mute:#98A1AF;--navy:#16295C;--navy-d:#0D1B42;--navy-t:#EDF1F9;--eyebrow:#2B4C8E;--kakao:#FEE500;--f:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0F16;--card:#171D28;--tint:#1C2330;--line:#29303D;--hair:rgba(255,255,255,.09);--hair2:rgba(255,255,255,.06);--ink:#E8EBF1;--sub:#A9B1BE;--mute:#7A8392;--navy:#A9BCF0;--navy-t:#212B42;--eyebrow:#9DB4EC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F16;--card:#171D28;--tint:#1C2330;--line:#29303D;--hair:rgba(255,255,255,.09);--hair2:rgba(255,255,255,.06);--ink:#E8EBF1;--sub:#A9B1BE;--mute:#7A8392;--navy:#A9BCF0;--navy-t:#212B42;--eyebrow:#9DB4EC;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow:hidden}
button,textarea{font:inherit;color:inherit}
.stage{position:fixed;top:0;left:0;bottom:0;right:var(--pw);padding:16px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);white-space:nowrap}
.bar b{color:var(--ink)}
.bar i{width:8px;height:8px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.18)}
.bar span:last-child{margin-left:auto;color:var(--mute)}
.fit{position:relative;flex:1;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(13,27,66,.06),0 20px 50px -24px rgba(13,27,66,.35);border:1px solid var(--hair)}
.fit iframe{position:absolute;left:0;top:0;width:1440px;border:0;transform-origin:0 0;background:#fff}
.fb{position:fixed;top:0;right:0;bottom:0;width:var(--pw);display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--hair)}
.fb-hd{padding:26px 26px 18px;border-bottom:1px solid var(--hair2);background:linear-gradient(180deg,#F7F9FC,#EEF2F8)}
:root[data-theme="dark"] .fb-hd{background:var(--tint)}
.eb2{display:block;font-size:10.5px;font-weight:800;letter-spacing:.2em;color:var(--eyebrow)}
.fb-hd h1{margin:6px 0 0;font-size:20px;font-weight:700;letter-spacing:-.03em}
.fb-hd p{margin:8px 0 0;font-size:12.5px;color:var(--sub);line-height:1.65}
.fb-bd{flex:1;overflow-y:auto;padding:20px 26px 24px;display:flex;flex-direction:column;gap:12px}
.fb-bd > *{flex-shrink:0}
textarea{min-height:170px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--tint);padding:14px 15px;font-size:14px;line-height:1.65;transition:border-color .15s,background .15s,box-shadow .15s}
textarea:focus{outline:none;background:var(--card);border-color:var(--navy);box-shadow:0 0 0 4px var(--navy-t)}
.send{height:50px;border:none;border-radius:999px;background:var(--navy-d);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;transition:background .15s}
:root[data-theme="dark"] .send{background:#2A3E78}
.send:hover{background:var(--navy)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.list h2{margin:4px 0 0;font-size:12.5px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:6px}
.list h2 em{font-style:normal;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--mute)}
.c{padding:12px 14px;border-radius:14px;border:1px solid var(--hair2);background:var(--tint);animation:in .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.c small{display:block;font-size:11px;color:var(--mute)}
.c p{margin:4px 0 0;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.fb-ft{padding:14px 26px 18px;border-top:1px solid var(--hair2);font-size:11.5px;color:var(--mute);line-height:1.6}
.toast{position:fixed;left:calc(50% - var(--pw) / 2);bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:12px;font-size:13px;white-space:nowrap;z-index:9}
.open{display:none}
@media (max-width:899px){
  .stage{right:0;padding:10px}
  .fb{top:auto;left:0;width:auto;max-height:82vh;border-left:none;border-radius:22px 22px 0 0;box-shadow:0 -20px 50px -20px rgba(13,27,66,.4);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:8}
  body.on .fb{transform:none}
  .fb-hd{border-radius:22px 22px 0 0;position:relative}
  .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(255,255,255,.7);color:var(--sub)}
  .open{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:7;height:46px;padding:0 20px;border:none;border-radius:999px;background:var(--navy-d);color:#fff;font-size:13.5px;font-weight:800;align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(13,27,66,.5)}
  .toast{left:50%}
}
@media (min-width:900px){.x{display:none}}
</style></head>
<body>
<main class="stage">
  <div class="bar"><i></i><b>오더진행조회 시안</b> · PC 화면 미리보기<span>화면 안을 직접 눌러 볼 수 있어요</span></div>
  <div class="fit" id="fit"><iframe id="pv" title="오더진행조회 시안 미리보기" srcdoc="&lt;title&gt;오더 진행조회&lt;/title&gt;
&lt;meta name=&quot;claude:viewport-fit-sides&quot; content=&quot;cover&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&amp;display=swap&quot;&gt;
&lt;style&gt;
/* 회사 홈페이지와 같은 디자인 언어
   · 남색 첫 화면(격자무늬) + 아주 굵은 흰 제목 · 강조어는 하늘색
   · 첫 화면 아래로 흰 카드가 걸쳐 올라옴 · 알약 버튼 · 파란 영문 소제목 + 굵은 제목
   조회: 상단 바 → 남색 첫 화면 → 걸친 입력 카드 → (PC) 오더번호 찾는 법 → 자주 묻는 질문 → 회사 정보
   결과: 상단 바 → 남색 첫 화면(상태) → 걸친 단계 카드 → 설치 정보 → 지금 단계 → 진행 기록 → 문의 띠 */
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --tint:#F5F7FA; --line:#E3E7EE; --hair:rgba(20,30,60,.09); --hair2:rgba(20,30,60,.06);
  --ink:#141B2D; --sub:#566074; --mute:#98A1AF;
  --navy:#16295C; --navy-d:#0D1B42; --navy-t:#EDF1F9; --sky:#9EC2FF; --eyebrow:#2B4C8E;
  --green:#22A447; --green-d:#1B8A3B; --green-t:#E7F6EC; --kakao:#FEE500;
  --shadow:0 1px 2px rgba(13,27,66,.04),0 18px 40px -18px rgba(13,27,66,.18);
  --f:&#x27;Noto Sans KR&#x27;,system-ui,-apple-system,&#x27;Malgun Gothic&#x27;,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=&quot;light&quot;]){--bg:#0F141D;--card:#171D28;--tint:#1C2330;--line:#29303D;--hair:rgba(255,255,255,.09);--hair2:rgba(255,255,255,.06);--ink:#E8EBF1;--sub:#A9B1BE;--mute:#7A8392;--navy:#A9BCF0;--navy-t:#212B42;--eyebrow:#9DB4EC;--green:#2FB956;--green-d:#5BD07D;--green-t:#1C3326;color-scheme:dark}}
:root[data-theme=&quot;dark&quot;]{--bg:#0F141D;--card:#171D28;--tint:#1C2330;--line:#29303D;--hair:rgba(255,255,255,.09);--hair2:rgba(255,255,255,.06);--ink:#E8EBF1;--sub:#A9B1BE;--mute:#7A8392;--navy:#A9BCF0;--navy-t:#212B42;--eyebrow:#9DB4EC;--green:#2FB956;--green-d:#5BD07D;--green-t:#1C3326;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 시안 보기 전환 (시안 전용) */
.mo-stage .stagewrap{padding:28px 16px 40px;display:flex;justify-content:center}
.mo-stage .phone{width:390px;max-width:100%;border:10px solid #1A1F2B;border-radius:42px;box-shadow:0 24px 60px rgba(13,27,66,.25);background:var(--bg);height:820px;overflow-y:auto;position:relative}

/* 상단 바 */
.topbar{background:var(--card);border-bottom:1px solid var(--hair2);position:relative;z-index:3}
.topbar .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:16px 24px}
.logo{display:inline-flex;align-items:baseline;gap:3px;font-weight:900;font-size:22px;letter-spacing:-.05em;color:var(--navy-d);text-decoration:none}
:root[data-theme=&quot;dark&quot;] .logo{color:#fff}
.logo small{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:0}
.logo .y{color:inherit}
.gnb{display:flex;gap:26px;margin-left:auto;font-size:14.5px;font-weight:500;white-space:nowrap}
.gnb a{text-decoration:none;color:var(--ink)}
.gnb a:hover{color:var(--navy)}
.gnb + .pill{margin-left:14px}
.pill.mall{background:var(--green-t);color:var(--green-d);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.track{background:var(--card);color:var(--ink);border-color:var(--line)}
.pill.track.on{background:var(--navy-t);border-color:color-mix(in srgb,var(--navy) 30%,transparent);color:var(--navy)}
.mo .gnb,.mo .pill.mall,.mo .pill.login{display:none}
.mo .pill.track,.mo .pill.mhome{height:34px;padding:0 13px;font-size:12.5px;margin-left:auto}
.pill.mhome{display:none}
.mo .pill.mhome{display:inline-flex}
.mo .trk .pill.track{display:none}
/* 홈페이지 (시안용 재현) */

/* 유도 애니메이션 */
@keyframes ripple{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.35,1.6)}}
@keyframes shine{0%{background-position:160% 0}60%,100%{background-position:-60% 0}}
@keyframes nudgeX{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
@keyframes bobL{0%,100%{transform:translate(0,-50%)}50%{transform:translate(5px,-50%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sky) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--sky) 35%,transparent)}}
@keyframes tipIn{from{opacity:0}to{opacity:1}}
.lure{position:relative;isolation:isolate}
.lure::before,.lure::after{content:&#x27;&#x27;;position:absolute;inset:0;border-radius:inherit;border:2px solid var(--sky);z-index:-1;animation:ripple 1.8s ease-out infinite}
.lure::after{animation-delay:.9s}
.hq{animation:glow 2.4s ease-in-out infinite}
.hq-go{background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;background-repeat:no-repeat;animation:shine 2.6s ease-in-out infinite}
.hq-go svg,.back.lure svg{animation:nudgeX 1.1s ease-in-out infinite}
.back.lure svg{animation-direction:reverse}
.tipb{position:absolute;z-index:3;white-space:nowrap;padding:7px 12px;border-radius:10px;background:var(--navy-d);color:#fff;font-size:12px;font-weight:700;pointer-events:none;box-shadow:0 8px 18px -8px rgba(13,27,66,.5);animation:tipIn .4s .8s both,bob 1.6s 1.2s ease-in-out infinite}
.tipb::after{content:&#x27;&#x27;;position:absolute;width:10px;height:10px;background:inherit;transform:rotate(45deg)}
.tipb.up{left:50%;bottom:calc(100% + 12px);transform:translateX(-50%)}
.tipb.up::after{left:50%;bottom:-4px;margin-left:-5px}
.tipb.rt{left:calc(100% + 14px);top:50%;transform:translateY(-50%);animation:tipIn .4s .8s both,bobL 1.6s 1.2s ease-in-out infinite}
.tipb.rt::after{left:-4px;top:50%;margin-top:-5px}
.hq-go{position:relative}
.back{position:relative}
.kl.lure::before,.kl.lure::after{border-color:#F2D600}
.kakao .new{font-style:normal;margin-left:2px;padding:2px 6px;border-radius:999px;background:#E5484D;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.06em;animation:newp 1.6s ease-in-out infinite}
@keyframes newp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.kakao.kl svg{animation:wig 2.4s ease-in-out infinite;transform-origin:50% 60%}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-14deg)}80%{transform:rotate(12deg)}85%{transform:rotate(-8deg)}90%{transform:rotate(5deg)}}
.tipb.upr{right:0;bottom:calc(100% + 14px);animation:tipIn .4s .8s both,bobY 1.6s 1.2s ease-in-out infinite}
.tipb.upr::after{right:28px;bottom:-4px}
body.k-open .tipb.upr{display:none}
@media (prefers-reduced-motion: reduce){.kakao .new,.kakao.kl svg{animation:none}}
@media (prefers-reduced-motion: reduce){.lure::before,.lure::after,.hq,.hq-go,.hq-go svg,.back.lure svg,.tipb{animation:none!important}.tipb{opacity:1}}
/* 시안용 예시 오더 */

.hero .rh p{margin-top:12px}
.facts{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:18px 0;box-shadow:0 8px 22px -14px rgba(13,27,66,.25)}
.facts div{padding:0 26px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--hair2)}
.facts div:last-child{border-right:none}
.facts span{font-size:12px;color:var(--mute);white-space:nowrap}
.facts b{font-size:17px;font-weight:800;white-space:nowrap}
.facts div:last-child b{color:var(--navy)}
.mo .rh{flex-direction:column;align-items:flex-start;gap:20px;margin-top:16px}
.mo .hero .rh h1{font-size:27px}
.mo .facts{border-left:none;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px 0}
.mo .facts div{padding:0 18px;border-right:none}
.mo .facts div:nth-child(2){border-right:1px solid var(--hair2)}
.mo .facts{padding:14px 0}
.mo .facts div:first-child{display:none}
.mo .facts b{font-size:15px}

/* 결과: 걸친 단계 카드 */
.stepc{padding:0;overflow:hidden}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.steps li{position:relative;padding:26px 18px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border-right:1px solid var(--hair2)}
.steps li:last-child{border-right:none}
.steps li i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card);color:var(--mute);font-style:normal;font-weight:800;font-size:13px}
.steps li.done i{background:var(--navy-d);border-color:var(--navy-d);color:#fff}
:root[data-theme=&quot;dark&quot;] .steps li.done i{background:#2A3E78;border-color:#2A3E78}
.steps li.cur{background:linear-gradient(180deg,var(--navy-t),transparent)}
.steps li.cur::before{content:&#x27;&#x27;;position:absolute;left:0;right:0;top:0;height:3px;background:var(--green)}
.steps li.cur i{border-color:var(--green);color:var(--green-d);background:var(--card)}
.steps b{font-size:15px;font-weight:700;color:var(--mute);white-space:nowrap}
.steps li.done b{color:var(--ink)}
.steps li.cur b{color:var(--ink);font-weight:900}
.steps small{font-size:12.5px;color:var(--mute);font-weight:500}
.steps li.cur small{color:var(--green-d);font-weight:700}
.mo .steps{grid-template-columns:1fr}
.mo .card.stepc{padding:0}
.mo .steps li{flex-direction:row;text-align:left;padding:14px 20px;gap:12px;border-right:none;border-bottom:1px solid var(--hair2)}
.mo .steps li:last-child{border-bottom:none}
.mo .steps li i{width:28px;height:28px;font-size:12px}
.mo .steps small{margin-left:auto}
.mo .steps li.cur{background:linear-gradient(90deg,var(--navy-t),transparent)}
.mo .steps li.cur::before{right:auto;bottom:0;width:3px;height:auto}

/* 결과 본문: ① 설치 정보 → ② 지금 단계 → ③ 진행 기록 → ④ 문의 */
.rgrid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:&quot;info info&quot; &quot;main note&quot;;align-items:stretch}
.rgrid.wide{grid-template-areas:&quot;info info&quot; &quot;main main&quot; &quot;note note&quot;}
.rgrid.nonote{grid-template-columns:minmax(0,1fr);grid-template-areas:&quot;info&quot; &quot;main&quot;}
.a-info{grid-area:info}.a-main{grid-area:main;min-width:0;display:flex;flex-direction:column}.a-main &gt; .card{flex:1}.a-note{grid-area:note}
.rgrid.tall .a-note{align-self:start;position:sticky;top:20px}
/* PC: 설치 정보는 가로 한 줄 */
.pc .istrip{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:18px 0}
.pc .istrip .kv{display:flex;flex-direction:column;gap:6px;padding:0 22px;border-top:none;border-left:1px solid var(--hair2)}
.pc .istrip .kv:nth-child(4n+1){border-left:none;padding-left:0}
.pc .istrip.c3 .kv{border-left:1px solid var(--hair2);padding-left:22px}
.pc .istrip.c3 .kv:nth-child(3n+1){border-left:none;padding-left:0}
.pc .istrip .kv dt{font-size:12.5px}
.pc .istrip .kv dd{font-size:15.5px}
.pc .wide .a-note .notice{flex-direction:row;gap:36px}
.pc .wide .ph{grid-template-columns:repeat(6,1fr)}
.mo .rgrid{grid-template-columns:1fr;grid-template-areas:&quot;info&quot; &quot;main&quot; &quot;note&quot;;gap:14px}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px solid var(--hair2);font-size:14.5px;margin:0}
.kv:first-child{border-top:none;padding-top:0}
.kv dt{color:var(--mute);font-weight:500}
.kv dd{margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.notice li{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;white-space:nowrap}
.notice li i{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--navy-t);color:var(--navy);display:grid;place-items:center}
.notice li small{color:var(--mute);font-weight:400;margin-left:-4px}
.vbox{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border:1px solid var(--hair2);border-radius:18px;padding:22px 0}
.vd{display:flex;align-items:center;gap:16px;padding:0 28px}
.vd + .vd{border-left:1px solid var(--hair)}
.vd i{flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--hair);color:var(--navy);display:grid;place-items:center;font-style:normal}
.vd span{display:block;font-size:12.5px;color:var(--mute)}
.vd b{display:block;margin-top:3px;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.vd b small{font-size:14px;font-weight:400;color:var(--sub);margin-left:2px}
.mo .vbox{grid-template-columns:1fr;padding:4px 0}
.mo .vd{padding:16px 18px}
.mo .vd + .vd{border-left:none;border-top:1px solid var(--hair)}
.mo .vd i{width:42px;height:42px}
.mo .vd b{font-size:17px}
.tix{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.tix &gt; div{padding:20px 24px;border-left:1px solid var(--hair2);display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.tix &gt; div:first-child{border-left:none;background:var(--navy-d);color:#fff}
:root[data-theme=&quot;dark&quot;] .tix &gt; div:first-child{background:#2A3E78}
.tix span{font-size:12.5px;color:var(--mute);white-space:nowrap}
.tix &gt; div:first-child span{color:rgba(255,255,255,.6)}
.tix b{font-size:16px;font-weight:700;white-space:nowrap}
.tix b.big{font-size:21px;font-weight:600;letter-spacing:-.02em}
.tix b.big small{font-size:14px;font-weight:400;margin-left:4px;opacity:.75}
.tix.cx{grid-template-columns:1fr 1.4fr 1fr}
.tix.cx &gt; div:first-child{background:var(--tint);color:var(--ink)}
.tix.cx &gt; div:first-child span{color:var(--mute)}
.vnote{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:13.5px;color:var(--sub)}
.vnote b{color:var(--ink);font-weight:700}
.mo .tix,.mo .tix.cx{grid-template-columns:1fr 1fr}
.mo .tix &gt; div{padding:16px 16px;border-top:1px solid var(--hair2)}
.mo .tix &gt; div:first-child{grid-column:1/-1;border-top:none}
.mo .tix &gt; div:nth-child(2){border-left:none}
.mo .tix.cx &gt; div:nth-child(2){grid-column:auto}
.mo .tix.cx &gt; div:nth-child(2){grid-column:1/-1}
.mo .tix.cx &gt; div:nth-child(3){grid-column:1/-1}
.mo .tix b.big{font-size:19px}
.mo .tix:not(.cx) &gt; div:nth-child(2){grid-column:1/-1}
.mo .vnote{align-items:flex-start;font-size:13px}
.mo .vnote svg{margin-top:3px;flex:0 0 auto}
.kd.cx{border-color:var(--line);background:var(--tint);color:var(--sub)}
.kd.cx::before{background:var(--mute)}
.stepc{position:relative}
.steps.gray{filter:grayscale(1);opacity:.42}
.steps.gray li.done i{background:#9AA2AF;border-color:#9AA2AF}
:root{--red:#C2413B;--red-t:#FBEDEC}
.steps li.end::before{content:&#x27;&#x27;;position:absolute;left:0;right:0;top:0;height:3px}
.mo .steps li.end::before{right:auto;bottom:0;width:3px;height:auto}
.steps li.end.good{background:linear-gradient(180deg,var(--green-t),transparent)}
.mo .steps li.end.good{background:linear-gradient(90deg,var(--green-t),transparent)}
.steps li.end.good::before{background:var(--green)}
.steps li.end.good i{background:var(--green);border-color:var(--green);color:#fff}
.steps li.end.good b,.steps li.end.good small{color:var(--green-d)!important;font-weight:800}
.steps li.end.bad{background:linear-gradient(180deg,var(--red-t),transparent)}
.mo .steps li.end.bad{background:linear-gradient(90deg,var(--red-t),transparent)}
.steps li.end.bad::before{background:var(--red)}
.steps li.end.bad i{background:var(--red);border-color:var(--red);color:#fff}
.steps li.end.bad b,.steps li.end.bad small{color:var(--red)!important;font-weight:800}
.st-good .hero h1 em{color:var(--green-d);background:linear-gradient(transparent 66%,color-mix(in srgb,var(--green) 22%,transparent) 66%)}
.st-bad .hero h1 em{color:var(--red);background:linear-gradient(transparent 66%,color-mix(in srgb,var(--red) 16%,transparent) 66%)}
.st-good .facts div:last-child b{color:var(--green-d)}
.st-bad .facts div:last-child b{color:var(--red)}
.kd.bad{border-color:color-mix(in srgb,var(--red) 30%,transparent);background:var(--red-t);color:var(--red)}
.kd.bad::before{background:var(--red)}
.st-good .log li.now i{background:var(--green);border-color:var(--green)}
.st-bad .log li.now i{background:var(--red);border-color:var(--red)}
.ok.bad{background:var(--red-t)}
.mo .ct span.r{display:none}
.ok.bad i{background:var(--red)}
.rgrid.nomain{grid-template-areas:&quot;info&quot;}
/* 취소 A: 카드 머리 띠 */
.cxbar{display:flex;align-items:center;gap:10px;padding:15px 26px;background:var(--tint);border-bottom:1px solid var(--hair2);color:var(--sub);white-space:nowrap}
.cxbar b{font-size:14.5px;font-weight:700}
.cxbar span{margin-left:auto;font-size:13px;color:var(--mute)}
.cxbar em{font-style:normal;color:var(--sub);font-weight:600;margin-left:10px}
.mo .cxbar{flex-wrap:wrap;padding:14px 18px;row-gap:4px}
.mo .cxbar span{margin-left:28px;width:100%}
.cxr{display:flex;align-items:center;gap:22px;padding:18px 24px;border-radius:16px;background:var(--tint);border:1px solid var(--hair2)}
.cxr span{font-size:13px;color:var(--mute);white-space:nowrap}
.cxr b{font-size:16px;font-weight:700;color:var(--sub)}
.mo .cxr{flex-direction:column;align-items:flex-start;gap:4px;padding:16px 18px}
/* 취소 건은 전체를 회색 톤으로 */
.isx .steps li.done i{background:#AEB5C1;border-color:#AEB5C1}
.isx .steps li.done b{color:var(--sub)}
.isx .hero h1{color:var(--sub)}
.isx .hero h1 em{color:var(--sub);background:linear-gradient(transparent 66%,color-mix(in srgb,var(--mute) 28%,transparent) 66%)}
.isx .facts b,.isx .facts div:last-child b{color:var(--sub)}
.isx .istrip dd,.isx .kv dd{color:var(--sub)}
.isx .log li i{border-color:#AEB5C1}
.isx .log li.now i{background:#AEB5C1}
.isx .log li b{color:var(--sub)}
.isx .tix b{color:var(--sub)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph button{aspect-ratio:4/3;border:none;border-radius:16px;padding:0;overflow:hidden;background:var(--tint);position:relative}
.ph button svg{width:100%;height:100%;display:block;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ph button:hover svg{transform:scale(1.05)}
.ph button span{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(13,27,66,.6);color:#fff;padding:3px 9px;border-radius:999px}
.mo .ph{gap:6px}
.mo .ph button{border-radius:12px}
.ok{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--green-t)}
.ok i{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.ok b{display:block;font-size:14.5px;font-weight:800}
.ok span{font-size:12.5px;color:var(--sub)}
.log{list-style:none;margin:0;padding:0;display:flex}
.log li{position:relative;padding:0 18px 0 0;flex:1 1 0;min-width:0}
.log li:last-child{flex:0 0 auto;padding-right:0}
.log li::before{content:&#x27;&#x27;;position:absolute;left:0;right:0;top:6px;height:1px;background:var(--hair)}
.log li:last-child::before{right:auto;width:13px}
.log li i{position:relative;display:block;width:13px;height:13px;border-radius:50%;background:var(--card);border:2px solid var(--navy);margin-bottom:12px}
.log li.now i{background:var(--navy)}
.log li span{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.log li b{display:block;font-size:15px;font-weight:800;margin-top:2px;white-space:nowrap}
.log li small{display:block;font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap}
.mo .log{flex-direction:column;gap:16px}
.mo .log li{padding:0 0 0 26px;flex:none}
.mo .log li::before{left:6px;right:auto;top:14px;bottom:-16px;width:1px;height:auto}
.mo .log li:last-child::before{display:none}
.mo .log li i{position:absolute;left:0;top:2px;margin:0}

/* 문의 띠 */
.cta{display:flex;align-items:center;gap:20px;padding:30px 34px;border-radius:24px;background:var(--navy-d);color:#fff;position:relative;overflow:hidden}
:root[data-theme=&quot;dark&quot;] .cta{background:#16203B}
.cta::before{content:&#x27;&#x27;;position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000);-webkit-mask-image:linear-gradient(90deg,transparent,#000)}
.cta &gt; *{position:relative}
.cta .eb2{color:var(--sky)}
.cta h3{margin:6px 0 0;font-size:22px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.cta p{margin:4px 0 0;font-size:13px;color:rgba(255,255,255,.65);white-space:nowrap}
.cta .btns{margin-left:auto;display:flex;gap:10px}
.cta .tel{height:48px;padding:0 22px;border-radius:999px;background:#fff;color:var(--navy-d);display:inline-flex;align-items:center;gap:8px;font-weight:800;text-decoration:none;white-space:nowrap}
.cta .kakao{height:48px;margin:0}
.mo .cta{flex-direction:column;align-items:stretch;padding:24px 20px;gap:16px}
.mo .cta .btns{margin:0;display:grid;grid-template-columns:1fr 1fr}
.mo .cta .tel,.mo .cta .kakao{justify-content:center;padding:0 10px;font-size:13.5px}
.foot{text-align:center;font-size:12px;color:var(--mute);margin:0}

/* 가견적서 (대외비) */
.est{padding:0;overflow:hidden}
.conf{display:flex;align-items:center;gap:10px;padding:13px 24px;background:var(--navy-d);color:#fff;font-size:12.5px;white-space:nowrap}
:root[data-theme=&quot;dark&quot;] .conf{background:#16203B}
.conf b{font-weight:900;letter-spacing:.2em;padding-right:10px;border-right:1px solid rgba(255,255,255,.3)}
.conf span{opacity:.8}
.doc{position:relative;padding:30px 32px 28px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mo .doc{padding:22px 20px}
.mo .conf{padding:12px 18px;font-size:11.5px}
.doc &gt; *{position:relative;z-index:1}
.doc .wmk{position:absolute;inset:0;z-index:2;pointer-events:none;background-repeat:repeat}
.dhd{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:3px double var(--ink)}
.dhd h3{margin:0;font-size:23px;font-weight:700;letter-spacing:.5em}
.stamp{border:1.5px solid var(--navy);color:var(--navy);font-weight:800;font-size:12px;letter-spacing:.3em;padding:4px 6px 4px 10px;border-radius:3px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--navy)}
.dmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding:16px 0;border-bottom:1px solid var(--hair);margin:0;font-size:13px}
.mo .dmeta{grid-template-columns:1fr}
.dmeta div{display:flex;gap:10px}
.dmeta dt{color:var(--mute);min-width:56px;white-space:nowrap}
.dmeta dd{margin:0;font-weight:700;white-space:nowrap}
.etb{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.etb th{text-align:center;font-weight:600;color:var(--sub);font-size:12px;padding:10px 4px;border-bottom:1px solid var(--ink)}
.etb th:first-child{text-align:left}
.etb th:last-child{text-align:right}
.etb td{padding:13px 4px;border-bottom:1px solid var(--hair2);text-align:right;vertical-align:top;font-weight:600;white-space:nowrap}
.etb td:first-child{text-align:left}
.etb td:nth-child(2){text-align:center;font-weight:500}
.etb td .ix{display:inline-block;width:26px;color:var(--mute);font-size:11.5px;font-weight:600}
.etb td small{display:block;padding-left:26px;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px}
.etot{display:flex;flex-direction:column;gap:6px;padding:16px 4px 4px}
.etot div{display:flex;justify-content:space-between;font-size:13.5px;color:var(--sub)}
.etot .t{border-top:2px solid var(--ink);padding-top:12px;margin-top:4px;color:var(--ink);align-items:baseline}
.etot .t span{font-weight:800;letter-spacing:.1em}
.etot .t b{font-size:30px;font-weight:900;letter-spacing:-.03em;color:var(--navy)}
.etot .t b small{font-size:14px;font-weight:600;margin-left:2px}
.pc .dbody{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:32px;align-items:start;margin-top:22px}
.pc .dmeta{padding-top:0}
.pc .dsum{background:var(--tint);border:1px solid var(--hair2);border-radius:18px;padding:22px 22px 18px;position:sticky;top:20px}
.pc .dsum .etot{padding:0}
.pc .dsum .etot .t{flex-direction:column;align-items:flex-start;gap:4px}
.pc .dsum .etot .t b{font-size:34px}
.pc .dsum .enote{background:var(--card);white-space:normal;line-height:1.65}
.pc .dsum .enote b{display:block}
.pc .dsum .dsign{border-top:1px solid var(--hair)}
.enote{margin:14px 0 0;font-size:13px;color:var(--sub);background:var(--tint);border-radius:12px;padding:12px 14px}
.enote b{color:var(--ink)}
.dsign{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair2);font-size:12.5px;color:var(--sub)}
.dsign b{font-size:14.5px;color:var(--ink);font-weight:800}

/* 회사 정보 */
.sfoot{border-top:1px solid var(--hair2);background:var(--card);padding-bottom:60px}
.sfoot .in{max-width:1200px;margin:0 auto;padding:26px 24px 34px;font-size:12px;color:var(--mute);line-height:1.8}
.sfoot b{color:var(--sub);font-weight:700}
.mo .sfoot .in{padding:20px 16px 26px;font-size:11px}

.lb{position:fixed;inset:0;background:rgba(8,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:20}
.lb svg{width:min(92vw,620px);height:auto;border-radius:14px}
.lb p{margin:0;color:#fff;font-size:13px}
.lb button{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px}
/* 상담처 선택 창 · 진행조회와 같은 맑은 하늘빛 */
.kpop{position:fixed;font-family:var(--f);right:28px;bottom:100px;z-index:35;width:404px;background:linear-gradient(180deg,#F7F9FC 0%,#E8EEF8 100%);color:var(--ink);border-radius:24px;border:1px solid rgba(22,41,92,.08);box-shadow:0 34px 70px -22px rgba(13,27,66,.4),0 2px 6px rgba(13,27,66,.05);animation:pop .28s cubic-bezier(.2,.8,.2,1);transform-origin:100% 100%}
.kpop::after{content:&#x27;&#x27;;position:absolute;right:44px;bottom:-7px;width:14px;height:14px;background:#E8EEF8;border-right:1px solid rgba(22,41,92,.08);border-bottom:1px solid rgba(22,41,92,.08);transform:rotate(45deg);border-bottom-right-radius:3px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.kin{position:relative;overflow:hidden;border-radius:24px}
.kin::before{content:&#x27;&#x27;;position:absolute;inset:0;background-image:linear-gradient(rgba(22,41,92,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(22,41,92,.06) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(210deg,#000,transparent 55%);mask-image:linear-gradient(210deg,#000,transparent 55%);pointer-events:none}
.kin::after{content:&#x27;&#x27;;position:absolute;right:-80px;top:-100px;width:260px;height:260px;background:radial-gradient(closest-side,rgba(158,194,255,.45),transparent);pointer-events:none}
.kin &gt; *{position:relative;z-index:1}
.kh{display:flex;align-items:center;gap:10px;padding:18px 16px 14px 22px}
.kh i{width:24px;height:24px;border-radius:8px;background:var(--kakao);color:#191919;display:grid;place-items:center}
.kh span{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.kx{margin-left:auto;width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,.7);color:var(--sub);font-size:13px;transition:background .15s}
.kx:hover{background:#fff;color:var(--ink)}
.kpop ul{list-style:none;margin:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.kpop li{animation:li .4s cubic-bezier(.2,.8,.2,1) both}
.kpop li:nth-child(2){animation-delay:.05s}.kpop li:nth-child(3){animation-delay:.1s}
@keyframes li{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpop li a{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:16px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid rgba(22,41,92,.06);box-shadow:0 1px 2px rgba(13,27,66,.04),0 6px 16px -12px rgba(13,27,66,.25);transition:box-shadow .2s,transform .2s}
.kpop li a:hover{transform:translateY(-1px);box-shadow:0 12px 24px -12px rgba(13,27,66,.35)}
.avw{flex:0 0 auto;padding:2px;border-radius:50%;background:conic-gradient(from 210deg,var(--c),color-mix(in srgb,var(--c) 30%,#fff),var(--c))}
.av{display:block;width:50px;height:50px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 2px #fff}
.kpop li a &gt; div{min-width:0;flex:1}
.kpop li a &gt; div &gt; b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.kpop li b small{font-size:11.5px;font-weight:600;color:var(--mute);margin-right:5px;letter-spacing:.01em}
.kpop li a &gt; div &gt; span{display:block;font-size:12.5px;color:var(--sub);margin-top:3px;white-space:nowrap}
.chat{font-style:normal;flex:0 0 auto;height:32px;padding:0 10px 0 13px;border-radius:999px;background:var(--kakao);color:#191919;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:3px;transition:box-shadow .2s}
.chat svg{width:13px;height:13px;transition:transform .2s}
.kpop li a:hover .chat{box-shadow:0 4px 10px -4px rgba(150,130,0,.55)}
.kpop li a:hover .chat svg{transform:translateX(2px)}
.kf{display:flex;align-items:center;gap:8px;padding:13px 22px 15px;border-top:1px solid rgba(22,41,92,.07);background:rgba(255,255,255,.55);font-size:12px;color:var(--sub);white-space:nowrap}
.kf::before{content:&#x27;&#x27;;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.kf b{margin-left:auto;color:var(--ink);font-weight:700}
.dim{position:fixed;inset:0;z-index:34;background:rgba(8,12,24,.4)}
.kpop.center{right:auto;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);animation:popC .28s cubic-bezier(.2,.8,.2,1)}
.kpop.center::after{display:none}
@keyframes popC{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
@media (max-width:899px){
  .kpop,.kpop.center{left:0;right:0;top:auto;bottom:0;width:auto;transform:none;border-radius:24px 24px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
  .kpop::after{display:none}
  .kin{border-radius:24px 24px 0 0}
  .kpop li a &gt; div &gt; span{font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .kpop li b small{display:block;margin:0 0 1px}
  .av{width:46px;height:46px}
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.kpop,.kpop li{animation:none}}
.sbox{position:relative}
.ldr{position:absolute;inset:0;z-index:6;border-radius:inherit;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:tipIn .35s both;font-family:var(--f)}
.ldr-box{display:flex;flex-direction:column;align-items:center;gap:14px}
.ldr .ring{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,color-mix(in srgb,var(--mute) 15%,transparent) 90deg,var(--mute) 300deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:spin 1.3s linear infinite;opacity:.8}
.ldr-box &gt; span:last-child{font-size:13px;color:var(--mute);letter-spacing:.01em}
@media (prefers-reduced-motion: reduce){.ldr .ring{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:12px;font-size:13px;z-index:30;white-space:nowrap}

/* 애니메이션 */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 40%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.steps li.cur i{animation:ring 2.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.rise,.steps li.cur i{animation:none}}

<aside class="fb" aria-labelledby="fbT">
  <div class="fb-hd"><span class="eb2">FEEDBACK</span><h1 id="fbT">시안 의견 남기기</h1><p>왼쪽 시안을 직접 눌러 보면서, 고치면 좋을 점을 자유롭게 남겨 주세요. 의견은 익명으로 저장돼요.</p><button type="button" class="x" id="x" aria-label="닫기">✕</button></div>
  <div class="fb-bd">
    <label for="txt" class="eb2" style="letter-spacing:.12em">의견</label>
    <textarea id="txt" placeholder="예) 방문 일정 카드에 기사님 연락처도 보이면 좋겠어요"></textarea>
    <button type="button" class="send" id="send">의견 등록하기</button>

</aside>
<button type="button" class="open" id="open">의견 남기기</button>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
  // 구글폼 '미리 채워진 링크'를 붙여 넣으세요 (질문 1개: 의견)
  var FORM_LINK = 'https://docs.google.com/forms/d/e/1FAIpQLSeekX05Jxh5E0b0sWgvjlL4bROlIvn5aTMH_OSTuihyKtw6MA/viewform?usp=pp_url&entry.1906625501=x';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
  var pad = function(n){ return String(n).padStart(2, '0'); };
  var tt; function toast(m){ $('toast').textContent = m; $('toast').hidden = false; clearTimeout(tt); tt = setTimeout(function(){ $('toast').hidden = true; }, 2600); }
  // PC 화면(1440px) 그대로 축소해서 보여 주기
  function fit(){ var box = $('fit'), sc = Math.min(1, box.clientWidth / 1440); $('pv').style.transform = 'scale(' + sc + ')'; $('pv').style.height = Math.ceil(box.clientHeight / sc) + 'px'; }
  window.addEventListener('resize', fit); fit();
  var mine = [];
  function render(){ $('list').innerHTML = mine.length ? '<h2>내가 남긴 의견 <em>' + mine.length + '</em></h2>' + mine.slice().reverse().map(function(c){ return '<div class="c"><small>' + c.t + '</small><p>' + esc(c.x) + '</p></div>'; }).join('') : ''; }
  $('send').onclick = function(){
    var x = $('txt').value.trim(); if (!x){ $('txt').focus(); toast('의견을 적어 주세요'); return; }
    var id = (FORM_LINK.match(/entry\.\d+/) || [])[0];
    if (id){ var b = new URLSearchParams(); b.append(id, x); fetch(FORM_LINK.split('?')[0].replace(/viewform$/, 'formResponse'), { method:'POST', mode:'no-cors', body:b }).catch(function(){}); toast('의견이 등록됐어요. 고마워요!'); }
    else toast('구글폼 연결 전이라 이 화면에만 보여요');
    var d = new Date(); mine.push({ x:x, t:pad(d.getHours()) + ':' + pad(d.getMinutes()) }); render(); $('txt').value = '';
  };
  $('open').onclick = function(){ document.body.classList.add('on'); };
  $('x').onclick = function(){ document.body.classList.remove('on'); };
})();
</script>
